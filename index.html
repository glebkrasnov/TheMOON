<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Moon</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>
    

<div class="wrapper">

  <!-- ДЛИННОЕ ИЗОБРАЖЕНИЕ -->
  <img src="тест 3.png" class="long-image" alt="">

  <!-- ======= ПРИМЕРЫ ЗАГЛУШЕК ======= -->

  <!-- ФОТО (по центру) -->
  <div class="mask"
       style="top: 1200px; height: 260px;"
       onclick="this.classList.add('hidden')">
  </div>

  <!-- ФОТО (справа) -->
  <div class="mask"
       style="top: 2600px; left: 58%; width: 36%; height: 240px;"
       onclick="this.classList.add('hidden')">
  </div>

  <!-- ВИДЕО -->
  <div class="mask"
       style="top: 4200px; height: 320px;"
       onclick="this.classList.add('hidden')">
  </div>

</div>

<!-- ===== DRAG & MOVE (ВРЕМЕННО ДЛЯ НАСТРОЙКИ) ===== -->
<script>
document.querySelectorAll('.mask').forEach(mask => {
  let startX = 0, startY = 0;
  let startTop = 0, startLeft = 0;

  mask.addEventListener('mousedown', e => {
    e.preventDefault();

    startX = e.clientX;
    startY = e.clientY;
    startTop = mask.offsetTop;
    startLeft = mask.offsetLeft;

    document.onmousemove = ev => {
      mask.style.top = startTop + (ev.clientY - startY) + 'px';
      mask.style.left = startLeft + (ev.clientX - startX) + 'px';
    };

    document.onmouseup = () => {
      document.onmousemove = null;
      document.onmouseup = null;

      console.log(
        `top: ${mask.style.top}; left: ${mask.style.left}; height: ${mask.offsetHeight}px; width: ${mask.offsetWidth}px;`
      );
    };
  });
});
</script>

</body>
</html>
