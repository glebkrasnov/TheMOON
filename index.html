<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<section class="login-screen" id="login">
    <div class="login-box">
        <h2>Прямо сейчас происходит магия</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p class="error" id="error"></p>
    </div>
</section>

<!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
<section class="content hidden" id="content">

    <!-- ФОН (твоя большая картинка) -->
    <img src="тест 3.png" class="long-image" alt="Фон">

    <!-- ================================================= -->
    <!-- 🔹 ПРИМЕР 1 — ФОТО -->
    <!-- ================================================= -->
    <div class="media-item"
         style="top: 300px; left: 120px; width: 260px; height: 180px;">

        <!-- САМО ФОТО -->
        <img src="photo1.jpg" class="media">

        <!-- ЗАГЛУШКА -->
        <div class="mask" onclick="hideMask(this)">
            <!-- если хочешь картинку-заглушку — см. CSS -->
        </div>
    </div>

    <!-- ================================================= -->
    <!-- 🔹 ПРИМЕР 2 — ВИДЕО -->
    <!-- ================================================= -->
    <div class="media-item"
         style="top: 600px; left: 400px; width: 300px; height: 200px;">

        <!-- САМО ВИДЕО -->
        <video class="media" controls>
            <source src="video1.mp4" type="video/mp4">
        </video>

        <!-- ЗАГЛУШКА -->
        <div class="mask" onclick="hideMask(this)"></div>
    </div>

    <!-- 🔁 ДАЛЬШЕ ПРОСТО КОПИРУЕШЬ media-item -->
</section>

<script>
/* ===== ПАРОЛЬ ===== */
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "222") {
        login.classList.add('hidden');
        content.classList.remove('hidden');
        error.textContent = "";
        window.scrollTo(0, 0);
    } else {
        error.textContent = "Э, не подглядывай";
    }
}

/* ===== ЗАГЛУШКИ ===== */
function hideMask(mask) {
    mask.classList.add('hidden');
}
</script>

</body>
</html>
