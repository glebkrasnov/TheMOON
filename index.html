<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- ПРИВЕТСТВИЕ -->
    <div id="welcome" class="welcome hidden">
        <span>Добро пожаловать,</span><br>
        <span class="name">Екатерина!</span>
    </div>

    <!-- БЕЛЫЙ КОНТЕЙНЕР -->
    <div id="contentBox" class="content-box hidden">

        <div id="love1" class="text hidden">
            С днём всех влюблённых 🥰
        </div>

        <div id="love2" class="text small hidden">
            Я очень рад, что ты моя вторая половинка! 🤗
        </div>

        <div id="media" class="hidden">
            <video src="IMG_29009.mp4" autoplay muted loop playsinline preload="auto"></video>
        </div>

    </div>

    <!-- Кнопка теперь вне контейнера -->
    <a href="https://lenta.com/gc/h5ig9Mo8hsc8wg3LrMvvYf/" class="gift-btn hidden" id="goBtn">
        👉 Это тебе! 👈
    </a>

</div>

<script>
const PASSWORD = "2589";

window.onload = () => {
    if (localStorage.getItem("auth") === "true") {
        startSequence();
    }
};

function checkPassword() {
    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (pass === PASSWORD) {
        localStorage.setItem("auth", "true");
        startSequence();
    } else {
        error.textContent = "Неверный пароль";
    }
}

function startSequence() {
    document.getElementById("login").classList.add("hidden");

    const welcome = document.getElementById("welcome");
    const box = document.getElementById("contentBox");
    const love1 = document.getElementById("love1");
    const love2 = document.getElementById("love2");
    const media = document.getElementById("media");
    const btn = document.getElementById("goBtn");

    // Появление приветствия
    welcome.classList.remove("hidden");
    setTimeout(() => welcome.classList.add("fade-out"), 2800);

    // Появление контейнера и первой фразы одновременно
    setTimeout(() => {
        welcome.classList.add("hidden");
        box.classList.remove("hidden");
        love1.classList.remove("hidden"); // появляется сразу с контейнером
    }, 3800);

    // Вторая фраза
    setTimeout(() => love2.classList.remove("hidden"), 6000);

    // Видео
    setTimeout(() => media.classList.remove("hidden"), 8200);

    // Кнопка появляется под контейнером
    setTimeout(() => btn.classList.remove("hidden"), 12500);
}
</script>

</body>
</html>
