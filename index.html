<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Moon</title>

<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<section class="login-screen" id="login">
  <div class="login-box">
    <h2>Введите пароль</h2>
    <input type="password" id="password" placeholder="Пароль">
    <button onclick="checkPassword()">Войти</button>
    <p class="error" id="error"></p>
  </div>
</section>

<!-- КОНТЕНТ -->
<section class="content hidden" id="content">

  <div class="image-wrapper">

    <!-- ОСНОВНАЯ КАРТИНКА -->
    <img src="тест 3.png" class="long-image">

    <!-- СКРЫТОЕ ФОТО -->
    <div class="mask" style="top: 420px; height: 260px;" onclick="reveal(this)">
      <img src="photo1.jpg">
    </div>

    <!-- СКРЫТОЕ ВИДЕО -->
    <div class="mask" style="top: 980px; height: 300px;" onclick="reveal(this)">
      <video src="video1.mp4" controls></video>
    </div>

  </div>

</section>

<script>
function checkPassword() {
  const pass = document.getElementById('password').value;
  if (pass === "2589") {
    login.classList.add("hidden");
    content.classList.remove("hidden");
  } else {
    error.textContent = "Неверный пароль";
  }
}

function reveal(el) {
  el.classList.add("open");
}
</script>

</body>
</html>
