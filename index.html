<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="login-box" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- ОТКРЫТКА -->
    <div class="card hidden" id="card">

        <!-- ОБЛОЖКА -->
        <div class="card-cover" id="cover">
            <!-- 👉 МЕНЯЕШЬ ДИЗАЙН ОБЛОЖКИ -->
            <div class="heart">❤️</div>
            <div class="tap-text">Нажми</div>
        </div>

        <!-- ВНУТРЕННЯЯ СТОРОНА -->
        <div class="card-inside">
            <div class="message" id="m1">Я хотел тебе кое-что сказать…</div>
            <div class="message" id="m2">Мне очень повезло, что у меня есть ты</div>
            <div class="message big" id="m3">Люблю тебя</div>

            <!-- 👉 ВАШЕ ФОТО -->
            <img src="photo.jpg" class="photo" id="photo">

            <div class="date" id="date">14.02</div>
        </div>
    </div>

    <!-- КНОПКА В КОНЦЕ -->
    <a href="https://example.com" class="gift-btn hidden" id="giftBtn">
        Это тебе!
    </a>

</div>

<script>
function checkPassword() {
    if (document.getElementById('password').value === "2589") {
        login.classList.add('hidden');
        card.classList.remove('hidden');
    } else {
        error.textContent = "Неверный пароль";
    }
}

const cover = document.getElementById('cover');
let opened = false;

cover.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    cover.classList.add('open');

    setTimeout(() => show('m1'), 600);
    setTimeout(() => show('m2'), 2000);
    setTimeout(() => show('m3'), 3500);
    setTimeout(() => show('photo'), 4800);
    setTimeout(() => show('date'), 6000);
    setTimeout(() => giftBtn.classList.remove('hidden'), 7200);
});

function show(id) {
    document.getElementById(id).classList.add('show');
}
</script>

</body>
</html>
