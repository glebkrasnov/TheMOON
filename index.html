<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">

    <title>The M O O N</title>

    <!-- ИКОНКА ДЛЯ iPHONE -->
    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">

    <!-- ОТКРЫТИЕ КАК ПРИЛОЖЕНИЕ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- СТИЛИ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- САЙТ В ОТПУСКЕ -->
    <div class="container hidden" id="vacation">
        <h2>🌚 Сайт находится в отпуске</h2>

        <div class="congrats-box center-text">
            Все не использованные сертификаты были скрыты.<br><br>
            Если вдруг понадобятся, напиши админу
        </div>
    </div>

</div>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "2589") {
        document.getElementById('login').classList.add('hidden');

        const vacation = document.getElementById('vacation');
        vacation.classList.remove('hidden');
        void vacation.offsetWidth;

        error.textContent = "";
    } else {
        error.textContent = "Неверный пароль";
    }
}
</script>

</body>
</html>
