<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- СВИТОК -->
    <div class="container hidden scroll-container" id="content">
        <div class="fade-top"></div>

        <img src="long.jpg" alt="Для тебя" class="long-image">

        <a href="https://example.com" class="gift-btn hidden" id="finalBtn">
            Это тебе!
        </a>
    </div>

</div>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "2589") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        error.textContent = "";
    } else {
        error.textContent = "Неверный пароль";
    }
}

// появление кнопки в конце скролла
const container = document.getElementById('content');
const btn = document.getElementById('finalBtn');

container.addEventListener('scroll', () => {
    const bottomReached =
        container.scrollTop + container.clientHeight >= container.scrollHeight - 20;

    if (bottomReached) {
        btn.classList.remove('hidden');
        btn.classList.add('show');
    }
});
</script>

</body>
</html>
