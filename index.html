<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- ОСНОВНОЙ КОНТЕНТ -->
    <div class="container transparent hidden center-text" id="content">

        <!-- Приветствие -->
        <div id="welcome" class="welcome hidden">
            Добро пожаловать, Екатерина!
        </div>

        <div id="media" class="hidden">
    <video src="IMG_2909.MP4" autoplay muted playsinline></video>
</div>


        <!-- Кнопка -->
        <a href="https://example.com" class="gift-btn hidden" id="goBtn">
            Это тебе!
        </a>

    </div>

</div>

<script>
const PASSWORD = "2589";

window.onload = () => {
    if (localStorage.getItem("auth") === "true") {
        showContent();
    }
};

function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === PASSWORD) {
        localStorage.setItem("auth", "true");
        showContent();
    } else {
        error.textContent = "Неверный пароль";
    }
}

function showContent() {
    document.getElementById('login').classList.add('hidden');
    const content = document.getElementById('content');
    content.classList.remove('hidden');

    const welcome = document.getElementById('welcome');
    const media = document.getElementById('media');
    const btn = document.getElementById('goBtn');

    // Приветствие
    setTimeout(() => {
        welcome.classList.remove('hidden');
        welcome.classList.add('fade-in');
    }, 300);

    // Убираем приветствие
    setTimeout(() => {
        welcome.classList.add('fade-out');
    }, 3000);

    // Показываем медиа
    setTimeout(() => {
        welcome.classList.add('hidden');
        media.classList.remove('hidden');
        media.classList.add('fade-in');
    }, 3800);

    // Кнопка
    setTimeout(() => {
        btn.classList.remove('hidden');
        btn.classList.add('fade-in');
    }, 5200);
}
</script>

</body>
</html>
