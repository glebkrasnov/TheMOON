<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<section class="login-screen" id="login">
    <div class="login-box">
        <h2>Прямо сейчас происходит магия</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p class="error" id="error"></p>
    </div>
</section>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<section class="content hidden" id="content">
    <div class="background-wrapper">
        <img src="bg04.09.png" alt="Для тебя" class="long-image">

        <!-- Элементы поверх картинки -->
        <div class="overlay-elements">

            <!-- ФОТО 1-20 -->
            <div class="overlay-item" style="top: 375px; left: 50px; width: 981px; height: 1161px;">
                <img src="photo1.png" class="hidden-media" alt="Фото 1">
                <div class="cover" onclick="this.style.display='none'"></div>
            </div>
            <div class="overlay-item" style="top: 1785px; left: 441px; width: 590px; height: 693px;">
                <img src="photo2.png" class="hidden-media" alt="Фото 2">
                <div class="cover" onclick="this.style.display='none'"></div>
            </div>
            <!-- …добавь остальные фото до photo20 аналогично, меняя координаты и src -->

            <!-- ВИДЕО 1-9 -->
            <div class="overlay-item" style="top: 7588px; left: 65px; width: 952px; height: 595px;">
                <video class="hidden-media" controls>
                    <source src="мужик потеет.mp4" type="video/mp4">
                </video>
                <div class="cover" onclick="this.style.display='none'"></div>
            </div>
            <div class="overlay-item" style="top: 400px; left: 50px; width: 320px; height: 180px;">
                <video class="hidden-media" controls>
                    <source src="video2.mp4" type="video/mp4">
                </video>
                <div class="cover" onclick="this.style.display='none'"></div>
            </div>
            <!-- …добавь остальные видео до video9 аналогично -->
        </div>
    </div>
</section>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "222") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        error.textContent = "";
        window.scrollTo(0, 0);
    } else {
        error.textContent = "Э, не подглядывай";
    }
}
</script>

</body>
</html>
