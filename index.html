<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- КОНТЕНТ -->
    <div class="content hidden" id="content">

        <div id="welcome" class="text big hidden">
            Добро пожаловать, Екатерина!
        </div>

        <div id="love1" class="text hidden">
            С днём всех влюблённых 🥰
        </div>

        <div id="love2" class="text small hidden">
            Я очень рад, что ты моя вторая половинка! 🤗
        </div>

        <div id="media" class="hidden">
            <video src="IMG_2909.MP4" autoplay muted loop playsinline preload="auto"></video>
        </div>

        <a href="https://example.com" class="gift-btn hidden" id="goBtn">
            Перейти
        </a>

    </div>

</div>

<script>
const PASSWORD = "2589";

window.onload = () => {
    if (localStorage.getItem("auth") === "true") {
        showContent();
    }
};

function checkPassword() {
    const pass = document.getElementById("password").value;
    const error = document.getElementById("error");

    if (pass === PASSWORD) {
        localStorage.setItem("auth", "true");
        showContent();
    } else {
        error.textContent = "Неверный пароль";
    }
}

function showContent() {
    document.getElementById("login").classList.add("hidden");
    document.getElementById("content").classList.remove("hidden");

    const welcome = document.getElementById("welcome");
    const love1 = document.getElementById("love1");
    const love2 = document.getElementById("love2");
    const media = document.getElementById("media");
    const btn = document.getElementById("goBtn");

    // Добро пожаловать
    setTimeout(() => welcome.classList.remove("hidden"), 300);
    setTimeout(() => welcome.classList.add("fade-out"), 2800);

    // С днём влюблённых
    setTimeout(() => {
        welcome.classList.add("hidden");
        love1.classList.remove("hidden");
    }, 3800);

    // Вторая строка
    setTimeout(() => {
        love2.classList.remove("hidden");
    }, 5200);

    // Видео
    setTimeout(() => {
        love1.classList.add("fade-out");
        love2.classList.add("fade-out");
    }, 7500);

    setTimeout(() => {
        love1.classList.add("hidden");
        love2.classList.add("hidden");
        media.classList.remove("hidden");
    }, 8500);

    // Кнопка
    setTimeout(() => {
        btn.classList.remove("hidden");
    }, 10500);
}
</script>

</body>
</html>
