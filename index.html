<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <!-- ИКОНКА -->
    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">

    <!-- ОТКРЫТИЕ КАК ПРИЛОЖЕНИЕ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- СТИЛИ -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="container" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- КОНТЕНТ ПОСЛЕ ВХОДА -->
    <div class="container hidden" id="content">
        <h2>🎁 Твой подарок</h2>

        <!-- КАРТИНКА -->
        <img src="gift.jpg" alt="Подарок" style="width:100%; border-radius:10px;">

        <!-- КНОПКА -->
        <a href="https://yandex.ru/pogoda/ru/nizhny-novgorod?lat=56.202014&lon=43.810565" class="gift-btn">
            Получить подарок
        </a>
    </div>

</div>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "2589") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        error.textContent = "";
    } else {
        error.textContent = "Неверный пароль";
    }
}
</script>

</body>
</html>
