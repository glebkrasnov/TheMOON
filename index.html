<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ================= ЭКРАН ВХОДА ================= -->
<section class="login-screen" id="login">
    <div class="login-box">
        <h2>Прямо сейчас происходит магия</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p class="error" id="error"></p>
    </div>
</section>

<!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
<section class="content hidden" id="content">

    <!-- ФОН -->
    <img src="bg04.09.png" alt="Фон" class="long-image">

    <!-- ================================================= -->
    <!-- ПРИМЕР ФОТО / ВИДЕО БЛОКА -->
    <!-- координаты берёшь из Photoshop -->
    <!-- ================================================= -->
    <div class="media-item"
         style="
            left: 50px;
            top: 375px;
            width: 981px;
            height: 1161px;
         ">

        <!-- ФОТО -->
        <img src="photo1.jpg" class="media">

        <!-- ЗАГЛУШКА -->
        <div class="mask" onclick="hideMask(this)"></div>
    </div>
    
    <!-- ================================================= -->
    <!-- 🔹 ПРИМЕР 2 — ВИДЕО -->
    <!-- ================================================= -->
    <div class="media-item"
         style="top: 7588px; left: 65px; width: 952px; height: 595px;">

        <!-- САМО ВИДЕО -->
        <video class="media" controls>
            <source src="мужик потеет.mp4" type="video/mp4">
        </video>

        <!-- ЗАГЛУШКА -->
        <div class="mask" onclick="hideMask(this)"></div>
    </div>

    <!-- 🔁 Копируешь media-item столько раз, сколько нужно -->

</section>

<script>
/* ===== ПАРОЛЬ ===== */
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "222") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        error.textContent = "";
        window.scrollTo(0, 0);
    } else {
        error.textContent = "Э, не подглядывай";
    }
}

/* ===== ЗАГЛУШКИ ===== */
function hideMask(mask) {
    mask.classList.add('hidden');
}
</script>

</body>
</html>
