<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>The M O O N</title>

    <link rel="apple-touch-icon" sizes="180x180" href="IMG_2777.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ВХОД -->
<div class="page" id="login">
    <div class="container">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>
</div>

<!-- КОНТЕНТ -->
<div id="content" class="hidden content">

    <!-- ДЛИННАЯ КАРТИНКА -->
    <img src="long.jpg" alt="Для тебя" class="long-image">

    <!-- КОНЕЦ + КНОПКА -->
    <div class="final-section">
        <a href="https://example.com" class="final-btn hidden" id="finalBtn">
            Это тебе!
        </a>
    </div>

</div>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "2589") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('content').classList.remove('hidden');
        error.textContent = "";
    } else {
        error.textContent = "Неверный пароль";
    }
}

// показать кнопку в конце страницы
const btn = document.getElementById('finalBtn');

window.addEventListener('scroll', () => {
    const bottomReached =
        window.innerHeight + window.scrollY >= document.body.offsetHeight - 40;

    if (bottomReached) {
        btn.classList.remove('hidden');
        btn.classList.add('show');
    }
});
</script>

</body>
</html>
