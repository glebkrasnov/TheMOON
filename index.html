<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>14.02</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="page">

    <!-- ВХОД -->
    <div class="login-box" id="login">
        <h2>Введите пароль</h2>
        <input type="password" id="password" placeholder="Пароль">
        <button onclick="checkPassword()">Войти</button>
        <p id="error" class="error"></p>
    </div>

    <!-- ОТКРЫТКА -->
    <div class="card hidden" id="card">

        <!-- ОБЛОЖКА -->
        <div class="card-cover" id="cover">
            <!-- 🔧 МЕНЯЕШЬ ДИЗАЙН ОБЛОЖКИ -->
            <div class="heart">❤️</div>
            <div class="tap-text">Нажми</div>
        </div>

        <!-- ВНУТРЕННЯЯ СТОРОНА -->
        <div class="card-inside">
            <div class="message" id="m1">С днём всех влюблённых 🥰</div>
            <div class="message" id="m2">Я очень рад, что ты моя вторая половинка! 🤗</div>
            
            <!-- 🔧 ВСТАВЬ СВОЁ ФОТО -->
            <img src="photo.jpg" class="photo" id="photo" alt="Мы">

            <div class="date" id="date"><strong>Люблю тебя! 💖</strong></div>
        </div>
    </div>

    <!-- КНОПКА В КОНЦЕ -->
    <a href="https://example.com" class="gift-btn hidden" id="giftBtn">
        Это тебе!
    </a>

</div>

<script>
function checkPassword() {
    const pass = document.getElementById('password').value;
    const error = document.getElementById('error');

    if (pass === "2589") {
        document.getElementById('login').classList.add('hidden');
        document.getElementById('card').classList.remove('hidden');
        error.textContent = "";
    } else {
        error.textContent = "Неверный пароль";
    }
}

const cover = document.getElementById('cover');
let opened = false;

cover.addEventListener('click', () => {
    if (opened) return;
    opened = true;

    cover.classList.add('open');

    setTimeout(() => show('m1'), 700);
    setTimeout(() => show('m2'), 2200);
    setTimeout(() => show('m3'), 3800);
    setTimeout(() => show('photo'), 3800);
    setTimeout(() => show('date'), 5200);
    setTimeout(() => document.getElementById('giftBtn').classList.remove('hidden'), 6500);
});

function show(id) {
    document.getElementById(id).classList.add('show');
}
</script>

</body>
</html>
